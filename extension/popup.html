<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #status-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid #38bdf8;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            animation: rotation 1s linear infinite;
            margin-top: 10px;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        button:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .footer {
            font-size: 0.7rem;
            color: #475569;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>CareerOps Import</h2>
        
        <div class="status-card">
            <div id="status-text">Pronto para importar</div>
            <div id="loader" class="loader"></div>
        </div>

        <button id="import-btn">Importar Perfil</button>
        <button id="import-job-btn" style="background: #10b981;">Importar Vaga Atual</button>
        <button id="bulk-jobs-btn" style="background: #f59e0b;">Capturar Todas da Busca</button>
        
        <div class="footer">
            Versão 22.0 - Automação IA Ativa
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
