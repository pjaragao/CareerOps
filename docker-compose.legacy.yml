services:
  # ── LinkedIn Jobs (Flask + Playwright) ──────────────────────
  linkedin-jobs:
    build:
      context: ./linkedin-jobs
      dockerfile: Dockerfile
    container_name: linkedin-jobs
    restart: unless-stopped
    ports:
      - "5050:5050"
      - "6080:6080"
    env_file:
      - ./linkedin-jobs/.env
    volumes:
      - /mnt/c/antigravity/resume:/app/output
      - linkedin_jobs_auth:/app/auth
    depends_on:
      - gotenberg
    networks:
      - supabase_network
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "application"
      paulojr.origin: "github"
      paulojr.ssl_port: "5051"

  # ── Gotenberg (HTML → PDF) ─────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg-jobs
    restart: unless-stopped
    ports:
      - "3006:3000"
    networks:
      - supabase_network
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "infrastructure"
      paulojr.origin: "dockerhub"

  # ── Portainer (Docker management UI) ────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - supabase_network
    environment:
      - TZ=America/Sao_Paulo
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "infrastructure"
      paulojr.origin: "dockerhub"
      paulojr.ssl_port: "9001"

volumes:
  linkedin_jobs_auth:
  portainer_data:

networks:
  supabase_network:
    external: true
    name: supabase_default
