<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Job Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="header" style="padding: 12px 24px;">
        <div class="header-left">
            <div class="logo">🎯</div>
            <div style="display:flex; flex-direction:column; margin-right: 10px;">
                <h1 style="margin:0; font-size: 18px; line-height:1.2">LinkedIn</h1>
                <span style="font-size:12px; color:var(--text-secondary); line-height:1">Job Scraper</span>
            </div>

            <div class="main-nav">
                <button class="active" onclick="switchMainView('jobs-view', this)">🔍 Job Feed</button>
                <button onclick="switchMainView('apps-view', this)">📊 My Applications</button>
            </div>

            <div class="actions-col" style="margin-left:auto;">
                <div class="action-group">
                    <button class="btn primary" onclick="openAddJobModal()" title="Add a job manually">
                        <span class="icon">➕</span> Add Job
                    </button>
                    <button class="btn secondary" onclick="runTask('pipeline')" id="btn-pipeline"
                        title="Run full automated pipeline">
                        <span class="icon">🚀</span> Pipeline
                    </button>
                    <button class="btn" onclick="runTask('scrape')" id="btn-scrape" title="Scrape jobs">
                        <span class="icon">🔍</span> Scrape
                    </button>
                    <button class="btn" onclick="runTask('process')" id="btn-process" title="Process descriptions">
                        <span class="icon">⚙️</span> Process
                    </button>
                </div>

                <div class="action-divider"></div>

                <div class="action-group">
                    <select id="model-select" class="btn" style="padding: 7px 10px; max-width: 120px; outline: none;">
                        <option value="gemini-3-flash-preview">Loading...</option>
                    </select>
                    <div class="dropdown" id="generate-dropdown">
                        <button class="btn success"
                            onclick="document.getElementById('generate-dropdown').classList.toggle('show')">
                            <span class="icon">📝</span> Generate <span
                                style="font-size:8px; margin-left:2px; opacity:0.6">▼</span>
                        </button>
                        <div class="dropdown-content">
                            <button onclick="runGenerateTask('generate', false)">Resume (Scraped)</button>
                            <button onclick="runGenerateTask('generate', true)">Resume (Selected)</button>
                            <button onclick="runGenerateTask('generate_cover_letter', false)">Cover Letter
                                (Scraped)</button>
                            <button onclick="runGenerateTask('generate_cover_letter', true)">Cover Letter
                                (Selected)</button>
                        </div>
                    </div>
                    <button class="btn" onclick="runTask('retry')" id="btn-retry" title="Retry generation errors">
                        <span class="icon">🔄</span> Retry
                    </button>
                </div>
            </div>
        </div>

        <div class="header-status">
            <div class="header-stats" id="header-stats" style="margin-left:auto; padding-left:0; border-left:none;">
                <div class="h-stat"><span class="h-label">Total</span><span class="h-val" id="stat-total">-</span></div>
                <div class="h-stat"><span class="h-label">Done</span><span class="h-val success" id="stat-done">-</span>
                </div>
                <div class="h-stat"><span class="h-label">Err</span><span class="h-val error" id="stat-error">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Job Modal -->
    <div id="addJobModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ Add Job Manually</h2>
                <span class="close" onclick="closeAddJobModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>Job Title *</label>
                <input type="text" id="manual-job-title" placeholder="Software Engineer">
            </div>
            <div class="form-group">
                <label>Company *</label>
                <input type="text" id="manual-company" placeholder="Acme Corp">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="manual-location" placeholder="Remote, Brazil">
            </div>
            <div class="form-group">
                <label>Job Post URL</label>
                <input type="text" id="manual-url" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Job Description *</label>
                <textarea id="manual-description" placeholder="Paste the full job description here..."></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn" onclick="closeAddJobModal()">Cancel</button>
                <button class="btn success" onclick="submitManualJob()">Save Job</button>
            </div>
        </div>
    </div>

    <!-- Application Modal -->
    <div id="appModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>📥 Register Application</h2>
                <span class="close" onclick="closeAppModal()">&times;</span>
            </div>
            <input type="hidden" id="app-id">
            <input type="hidden" id="app-job-id">
            <div class="form-group">
                <label>Company *</label>
                <input type="text" id="app-company" placeholder="Acme Corp">
            </div>
            <div class="form-group">
                <label>Job Title *</label>
                <input type="text" id="app-title" placeholder="Software Engineer">
            </div>
            <div class="form-group">
                <label>Apply Method</label>
                <select id="app-method"
                    style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); background:rgba(0,0,0,0.2); color:white; font-family:inherit;">
                    <option value="LinkedIn Easy Apply">LinkedIn Easy Apply</option>
                    <option value="LinkedIn External">LinkedIn External</option>
                    <option value="Company Website">Company Website</option>
                    <option value="Gupy">Gupy</option>
                    <option value="Email">Email</option>
                    <option value="Referral">Referral</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Initial Status</label>
                <select id="app-status"
                    style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); background:rgba(0,0,0,0.2); color:white; font-family:inherit;">
                    <option value="Applied">Applied</option>
                    <option value="Screening">HR Screening</option>
                    <option value="Interview">Interview</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes (Optional)</label>
                <textarea id="app-notes" style="height:60px;"
                    placeholder="Tracking links, expected salary, etc..."></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn" onclick="closeAppModal()">Cancel</button>
                <button class="btn success" onclick="submitApp()">Save Application</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Task Progress Banner -->
        <div id="task-banner" class="task-banner" style="display:none;">
            <div class="spinner"></div>
            <div style="flex:1">
                <div class="task-banner-text" id="task-name">Running...</div>
                <div class="task-banner-detail" id="task-progress"></div>
            </div>
            <button class="btn success" id="btn-finish-login" style="padding:6px 16px;font-size:12px;display:none"
                onclick="finishLogin()">✅ Finish Login</button>
            <button class="btn danger" style="padding:6px 16px;font-size:12px" onclick="cancelTask()">✖ Cancel</button>
        </div>

        <!-- Main content -->
        <div class="main-grid" id="jobs-view">
            <!-- Jobs Panel -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span>📋</span> Job Listings
                        <span id="job-count" style="color:var(--text-muted);font-weight:400;font-size:13px"></span>
                    </div>
                    <div class="filter-tabs" id="filter-tabs">
                        <button class="filter-tab active" data-filter="all"
                            onclick="setFilter('all', this)">All</button>
                        <button class="filter-tab" data-filter="new" onclick="setFilter('new', this)">New</button>
                        <button class="filter-tab" data-filter="scraped"
                            onclick="setFilter('scraped', this)">Scraped</button>
                        <button class="filter-tab" data-filter="done" onclick="setFilter('done', this)">Done</button>
                        <button class="filter-tab" data-filter="error" onclick="setFilter('error', this)">Error</button>
                        <div style="width:1px; height:20px; background:var(--border); margin:0 8px;"></div>
                        <button class="filter-tab" data-filter="easy_apply" onclick="setFilter('easy_apply', this)">Easy
                            Apply</button>
                        <button class="filter-tab" data-filter="not_applied"
                            onclick="setFilter('not_applied', this)">Not Applied</button>
                    </div>
                </div>
                <div class="panel-body" id="jobs-list">
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No jobs yet. Click "Scrape Jobs" to start.</p>
                    </div>
                </div>
            </div>

            <!-- Right sidebar -->
            <div style="display:flex;flex-direction:column;gap:20px">
                <!-- Log Panel -->
                <div class="panel log-panel">
                    <div class="panel-header">
                        <div class="panel-title"><span>📟</span> Activity Log</div>
                        <button class="btn" style="padding:4px 12px;font-size:11px" onclick="clearLogs()">Clear</button>
                    </div>
                    <div class="panel-body" id="log-body">
                        <div class="empty-state" style="padding:20px">
                            <p style="color:var(--text-muted)">Waiting for activity...</p>
                        </div>
                    </div>
                </div>

                <!-- Config Panel -->
                <div class="panel">
                    <div class="panel-header" style="justify-content: space-between;">
                        <div class="panel-title"><span>⚙️</span> Configuration</div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span id="header-status-text"
                                style="font-size:12px;color:var(--text-secondary)">Ready</span>
                            <div class="status-dot" id="status-dot"></div>
                        </div>
                    </div>
                    <div class="panel-body"
                        style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; justify-content: space-between;">
                        <button class="btn" onclick="runTask('login')" id="btn-login" style="color:#0077b5; flex: 1;">
                            <span class="icon">🔐</span> Login
                        </button>
                        <button class="btn danger" onclick="clearAllJobs()" id="btn-clear"
                            title="Clear all scraped jobs" style="flex: 1;">
                            <span class="icon">🧹</span> Clear
                        </button>
                    </div>
                    <div class="config-grid" id="config-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Applications View -->
    <div id="apps-view" style="display:none; margin-top: 10px;">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>📊</span> Applications Pipeline
                </div>
            </div>
            <div class="panel-body" style="padding: 20px;">
                <div class="apps-board" id="apps-board">
                    <!-- Kanban will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
