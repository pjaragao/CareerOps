# Rules for what the system does and sends on your behalf. After editing, commit and redeploy (config/ is baked into the image).
# Whether it runs at all (off / dry_run / live) and the daily limits are in the app: Automação → Buscas e limites.

# NDA: subjects that never appear in anything sent out (CV, cover letter, post, comment, invite, form answer).
# A text that still has one after one rewrite is refused, never sent. Your uploaded originals stay as they are.
content_guard:
  topics:
    - solid waste / resíduos sólidos
    - landfills / aterros sanitários
  patterns:
    - res[ií]duos?\s+s[oó]lidos?
    - res[ií]duos?\s+urbanos?
    - gest[aã]o\s+de\s+res[ií]duos?
    - solid[\s-]+wastes?
    - municipal\s+waste
    - waste\s+management
    - aterros?\s+sanit[aá]rios?
    - \blandfills?\b
    - \bRSU\b

automation:
  window: {start_hour: 8, end_hour: 23}      # APP_TIMEZONE: nothing is claimed outside it
  write_gap_minutes: [5, 20]                 # between two writes on LinkedIn, picked at random in this range
  apply_gap_minutes: [1, 3]                  # after an Easy Apply (~20 an hour; the daily apply limit still holds)
  max_windows: 6                             # all running actions together (company-site agents are tabs of one Chrome)
  lanes: {linkedin_read: 1, linkedin_write: 1, ats: 4}   # ats: company-site agents in parallel (cron runs slots 1-4)
  approval_hours: {apply: 168, comment: 48, connect: 168, follow: 168, reply: 48, like: 48, message: 72}
  search_hours: [8, 13, 18]                  # three rounds a day (jobs of the last 48 h, newest first)
  check_hours: [7, 19]                       # who accepted / replied
  feed_scan_hours: [10, 16]
  follow_scan_hours: [11]
  reply_scan_hours: [9, 13, 18]              # replies to your comments (notifications page)
  inbox_scan_hours: [8, 12, 17]              # received invitations and unread conversations
  ramp_days: 7                               # a week with no warning goes up one step of the limits

# The inbox (invitations and conversations): your rule for the language of the answers is in linkedin_inbox_service.py
inbox:
  auto_decline: true                         # a clear service offer gets a polite no on its own; you are told after
  decline_confidence: 0.8                    # below it, the no waits for your OK like any other message

linkedin:
  own_posts: false                           # posts of your own (drafted from themes, scheduled, published): off; comments go on

jobs:
  markets: [intl]                            # add br to take Brazilian employers again
  min_score: 70                              # below it the job goes to "Descartadas" (recoverable)
  external_apply: true                       # company sites (on since 2026-11-10, at your request; each one still waits for your OK)
  # Who reads the CV and the cover letter before they go: "agent" (a reviewer AI that sends them back to be redone, up to
  # cv_review_rounds times, and only calls you if they still fail) or "you" (the first 20 on the main account wait for you)
  cv_review: agent
  cv_review_rounds: 2
  resume_max_chars: 4800                     # the first version already fits two pages (the approved ones: 4,300–5,500)
  # token plan, phase 3 (2026-11-16)
  docs_on_demand: true                       # CV and cover letter only for jobs you approved, not for every import
  cv_archetypes: true                        # one approved CV per job family (AI, data, finance, infrastructure) and language, reused
  cover_cache: true                          # one cover letter per company and language, reused
  # the approval list (2026-11-22): a job the search proposed waits proposal_days; with a score below proposal_keep_score
  # and no answer it leaves the list for Descartadas (recoverable). How many enter per day: the job_propose limit in the app
  proposal_days: 10
  proposal_keep_score: 80
  link_days: 7                               # the approval link Lolo sends (jobs only, from any browser)

# Jobs from more places than LinkedIn (discovery_service.py): company boards (Greenhouse, Lever, Ashby, SmartRecruiters,
# Recruitee, Workable, Personio, Workday) and remote job boards, read by their public APIs. How many new ones the AI reads per
# day: the source_read limit in the app. Each kind can be switched off in Pesquisar vagas → Fontes.
discovery:
  enabled: true
  ats_hours: [6]                             # company boards, once a day (their jobs stay open for weeks)
  board_hours: [6, 14]                       # job boards, twice a day
  max_age_days: 14                           # job boards: older ads are left out (when the source says the date)
  max_age_days_ats: 30                       # company boards: their jobs stay open for weeks
  probe_per_day: 60                          # companies with a good job here whose name is tried on Greenhouse/Lever/Ashby
  details_per_round: 150                     # ads read one by one (SmartRecruiters, Workday) per round
  dedupe_days: 60                            # the same company + title within this many days is the same job

claude:
  per_day: 1000
  max_tokens_per_action: 1500000             # all runs of one action together (input + output + cache); then it is yours
  breaker_minutes: 30                        # a usage limit / 5xx / exhausted quota pauses every Claude run this long
  lanes: [linkedin_write, ats]               # remove linkedin_write for less risk: that fallback becomes "Precisa de você"

# A test account only comments on / invites these (exact URLs); anything else stops before the final click
test_account:
  allowed_targets: []

email:
  hour: 7                                    # local time of the daily read (07:30)
  minute: 30
  first_run_days: 45
  rejection_confidence: 0.9
  auto_status: true                          # rejection (≥ rejection_confidence), interview and offer move the job; undone from the job itself
  # Lolo reads them in Gmail: what only confirms or closes an application is marked read and archived (you are told on
  # WhatsApp); a next step (interview, test, a recruiter's question, an offer) stays in the inbox, unread, for you
  archive_classes: [confirmation, viewed, rejection]
  archive_confidence: 0.8

# Lolo, on WhatsApp: what it tells you and when (it fetches from /api/automation/bot/notifications)
bot:
  digest_minutes: 30                         # new items to approve come together, at most once in this interval
  split_over: 8                              # more than this, of more than one kind: one message per kind (jobs, comments...)
  quiet_hours: [22, 7]                       # from 22h to 7h only what is urgent: a stop, an interview, an offer, a LinkedIn warning
  done_kinds: [apply, comment]               # finished actions worth a message
