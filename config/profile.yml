  pt:
    about: 'Líder estratégico com formação em Engenharia e MBA, com sólida trajetória
      como Diretor na condução de projetos de infraestrutura de larga escala. Ao longo
      da minha carreira, especializei-me na gestão de contratos governamentais complexos
      e na coordenação de operações de alto impacto, garantindo a conformidade técnica
      e a viabilidade financeira em cenários desafiadores.

      Minha atuação atual é pautada pela convergência entre a gestão de engenharia
      e a inovação tecnológica. Utilizo minha visão analítica e executiva para liderar
      a automação de processos e a implementação de soluções de inteligência artificial
      que elevam a eficiência operacional. Sou movido pelo desafio de transformar
      operações tradicionais em fluxos de trabalho ágeis e orientados a resultados,
      unindo o rigor da engenharia à agilidade das novas tecnologias para otimizar
      negócios e infraestruturas.

      Hoje construo e opero sistemas de IA de ponta a ponta como único engenheiro:
      14 sistemas, 11 em produção na minha plataforma de produção em Docker/Coolify
      (48 containers, mais de 88 mil execuções de agentes e rotinas). Prototipo integrações,
      cadeias de prompts e tool calling no n8n e consolido com o Claude Code em serviços
      FastAPI, Next.js e Python sobre PostgreSQL — agentes de IA com ferramentas MCP,
      guardrails e aprovação humana, um ERP de varejo com mais de 2.000 testes, previsão
      bayesiana e TimesFM e automação de navegador.'
