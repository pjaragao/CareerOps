# A starting list of company boards for the daily job search (discovery_service.py). Checked live on 2026-11-22: each one
# answered with open jobs. The rest of the list fills itself every day: the boards of companies you applied through, the
# companies with a job scored ≥ 70 here (their name tried on Greenhouse, Lever and Ashby), and the companies the remote job
# boards point to. Add one here (kind + slug, or the url of any of its jobs) or paste a link in Pesquisar vagas → Fontes.
# A board that stops answering is marked "gone" and its company tried on the other ATS again.
