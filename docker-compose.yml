# CareerOps — deployed by Coolify (Docker Compose) or locally with `docker compose up -d --build`.
# No fixed container names, so a Coolify deployment never collides by name with a local stack.
# No source bind mounts: Coolify rewrites relative paths to empty folders, so code and config live in the images
# (rebuild with `docker compose up -d --build` after changing them).
# Host ports default to 8005 / 5173 / 3002 (the nginx on :5174 proxies to them); override with
# CAREEROPS_BACKEND_PORT, CAREEROPS_FRONTEND_PORT and GOTENBERG_PORT if two stacks must run at once.
services:
  # ── CareerOps Backend (FastAPI) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # config/ (CVs, LinkedIn texts, settings) and the extension are baked into the image
      additional_contexts:
        config: ./config
        extension: ./extension
    restart: unless-stopped
    ports:
      - "${CAREEROPS_BACKEND_PORT:-8005}:8000"
    # .env = variables written by Coolify from the app's Environment Variables (deploy);
    # linkedin-jobs/.env = local secrets file (git-ignored), wins when both exist.
    env_file:
      - path: .env
        required: false
      - path: ./linkedin-jobs/.env
        required: false
    volumes:
      - careerops_output:/app/output
    depends_on:
      - gotenberg
    networks:
      - supabase_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "application"
      paulojr.origin: "github"
      paulojr.ssl_port: "5174"
      coolify.managed: "true"
      coolify.applicationId: "1"
      coolify.type: "application"
      coolify.name: "slqfhcgt1uvhpqned6me9map"

  # ── CareerOps Frontend (React + Vite) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CAREEROPS_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - supabase_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "application"
      paulojr.origin: "github"

  # ── Gotenberg (HTML → PDF) ─────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "${GOTENBERG_PORT:-3002}:3000"
    networks:
      supabase_network:
        aliases:
          - gotenberg-jobs
          - gotenberg-v2
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "application"
      paulojr.origin: "dockerhub"
      coolify.managed: "true"
      coolify.applicationId: "1"
      coolify.type: "application"
      coolify.name: "slqfhcgt1uvhpqned6me9map"

volumes:
  careerops_output:

networks:
  supabase_network:
    external: true
    name: supabase_default
