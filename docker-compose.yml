services:
  # ── CareerOps Backend (FastAPI) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerops-backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - ./linkedin-jobs/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/main.py:/app/main.py
      - ./output:/app/output
      - ./config:/app/config
      - linkedin_jobs_auth:/app/auth
    depends_on:
      - gotenberg
    networks:
      - supabase_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "application"
      paulojr.origin: "github"
      paulojr.ssl_port: "5174"

  # ── CareerOps Frontend (React + Vite) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerops-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - supabase_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "application"
      paulojr.origin: "github"

  # ── Gotenberg (HTML → PDF) ─────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg-v2
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      supabase_network:
        aliases:
          - gotenberg-jobs
    labels:
      paulojr.stack: "careerops"
      paulojr.type: "application"
      paulojr.origin: "dockerhub"

volumes:
  linkedin_jobs_auth:
    external: true
    name: linkedin_resume_linkedin_jobs_auth

networks:
  supabase_network:
    external: true
    name: supabase_default
