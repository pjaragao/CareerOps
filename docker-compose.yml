services:
  # ── LinkedIn Jobs (Flask + Playwright) ──────────────────────
  linkedin-jobs:
    build:
      context: ./linkedin-jobs
      dockerfile: Dockerfile
    container_name: linkedin-jobs
    restart: unless-stopped
    ports:
      - "5050:5050"
      - "6080:6080"
    env_file:
      - ./linkedin-jobs/.env
    volumes:
      - /mnt/c/antigravity/resume:/app/output
      - linkedin_jobs_auth:/app/auth
    depends_on:
      - gotenberg
    networks:
      - supabase_network

  # ── Gotenberg (HTML → PDF) ─────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg-jobs
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - supabase_network

  # ── n8n (workflow automation) ───────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-docker
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=supabase-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=n8n_supabase_pass
      - DB_POSTGRESDB_SCHEMA=n8n
      - DB_POSTGRESDB_SEARCH_PATH=n8n,public,extensions
      - N8N_ENCRYPTION_KEY=gt1VzS/nxkGl1jVSk/faHoCa1fy/1ORS
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://100.126.174.177:5678/
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/.n8n-files
    networks:
      - supabase_network

  # ── Portainer (Docker management UI) ────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - supabase_network

volumes:
  linkedin_jobs_auth:
  n8n_data:
  n8n_files:
  portainer_data:

networks:
  supabase_network:
    external: true
    name: supabase_default
